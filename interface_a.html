<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interface A — Visão do Sensor + Probabilidades</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: monospace;
    background: #1a1a1a;
    color: #e0e0e0;
    padding: clamp(12px, 3vw, 32px);
    min-height: 100vh;
  }

  /* ── Nav buttons ── */
  .snav { display: flex; gap: 8px; margin-bottom: clamp(12px, 2vw, 20px); flex-wrap: wrap; }
  .sbtn {
    padding: clamp(5px, 1vw, 8px) clamp(12px, 2vw, 20px);
    border-radius: 20px; border: 1px solid #444;
    background: #222; color: #888; cursor: pointer;
    font-size: clamp(11px, 1.5vw, 14px);
    font-family: monospace; transition: all 0.15s;
  }
  .sbtn:hover { border-color: #666; color: #ccc; }
  .sbtn.s1.active { background: #2E7D32; border-color: #2E7D32; color: #fff; }
  .sbtn.s2.active { background: #E65100; border-color: #E65100; color: #fff; }
  .sbtn.s3.active { background: #E65100; border-color: #E65100; color: #fff; }
  .sbtn.s4.active { background: #B71C1C; border-color: #B71C1C; color: #fff; }
  .sbtn.s5.active { background: #B71C1C; border-color: #B71C1C; color: #fff; }

  /* ── Panel ── */
  .panel { border-radius: clamp(8px, 1.5vw, 14px); overflow: hidden; width: 100%; max-width: 960px; }

  .phdr {
    background: #0e0e0e; color: #ff4444;
    padding: clamp(8px, 1.5vw, 12px) clamp(12px, 2vw, 20px);
    font-size: clamp(9px, 1.2vw, 11px); letter-spacing: 2px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }
  .dot {
    width: clamp(5px, 1vw, 8px); height: clamp(5px, 1vw, 8px);
    border-radius: 50%; background: #ff4444;
    display: inline-block; margin-right: 8px; animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

  .pbody {
    background: #141414;
    padding: clamp(14px, 2.5vw, 24px);
    border: 1px solid #2a2a2a; border-top: none;
  }

  .slabel {
    font-size: clamp(9px, 1.2vw, 11px);
    color: #aaa; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: clamp(8px, 1.5vw, 12px);
  }

  /* ── LiDAR ── */
  .lidar-wrap { display: flex; justify-content: center; margin-bottom: clamp(14px, 2.5vw, 24px); }
  .lidar-wrap img {
    display: block;
    height: clamp(130px, 20vw, 220px);
    width: auto;
    border-radius: clamp(10px, 2vw, 18px);
  }

  /* ── Map grid ── */
  .mgrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 1.5vw, 16px);
  }
  .mcard {
    background: #141414; border: 1px solid #2a2a2a;
    border-radius: clamp(6px, 1vw, 10px);
    padding: clamp(10px, 1.5vw, 16px);
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(6px, 1vw, 10px);
    position: relative;
    overflow: hidden;
  }
  .mcard::after {
    content: '';
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(255,255,255,0.04) 40%,
      rgba(255,255,255,0.07) 50%,
      rgba(255,255,255,0.04) 60%,
      transparent 100%
    );
    pointer-events: none;
  }
  .mcard:hover::after, .mcard:active::after {
    animation: scanline 0.9s ease-in-out;
  }
  @keyframes scanline {
    0%   { top: -40%; }
    100% { top: 110%; }
  }
  .mlabel { font-size: clamp(10px, 1.3vw, 12px); color: #aaa; letter-spacing: 1px; }
  .mcard img {
    max-width: 100%;
    height: clamp(70px, 10vw, 140px);
    object-fit: contain;
    filter: invert(1) grayscale(1) brightness(0.75);
  }

  /* ── Prob bar ── */
  .bwrap { width: 100%; }
  .bbg { background: #1e1e1e; border-radius: 3px; height: clamp(5px, 0.8vw, 8px); overflow: hidden; }
  .bfill { height: 100%; border-radius: 3px; transition: width .5s ease; }
  .pval { font-size: clamp(16px, 2.5vw, 22px); font-weight: 500; }
  .ph { color: #4CAF50; } .pm { color: #FF9800; } .pl { color: #cc2222; }
  #stag { font-size: clamp(10px, 1.3vw, 12px); color: #ccc; letter-spacing: 1px; }

  /* ── Mobile ── */
  @media (max-width: 520px) {
    .mgrid { grid-template-columns: 1fr; }
    .mcard img { height: clamp(100px, 40vw, 180px); }
    .lidar-wrap img { height: clamp(160px, 50vw, 240px); }
  }

  /* ── Tablet ── */
  @media (min-width: 521px) and (max-width: 768px) {
    .mgrid { grid-template-columns: repeat(3, 1fr); }
    .mcard img { height: clamp(60px, 12vw, 100px); }
    .lidar-wrap img { height: clamp(140px, 25vw, 200px); }
  }
</style>
</head>

const scenarios=[
  {id:1,cls:'s1',tag:'Cenário 1',          probs:[65,3,32]},
  {id:2,cls:'s2',tag:'Cenário 2', probs:[4,44,52]},
  {id:3,cls:'s3',tag:'Cenário 3',probs:[85,5,10]},
  {id:4,cls:'s4',tag:'Cenário 4',probs:[3,7,90]},
  {id:5,cls:'s5',tag:'Cenário 5',  probs:[3,49,47]},
];
function getColor(v){return v>=50?"#4CAF50":v>=20?"#FF9800":"#cc2222";}
function getCls(v){return v>=50?"ph":v>=20?"pm":"pl";}
function render(s){
  document.getElementById('stag').textContent=s.tag;
  document.getElementById('lidar-img').src=LIDAR[s.id-1];
  ['a','b','c'].forEach((m,i)=>{
    const v=s.probs[i];
    document.getElementById('bar-'+m).style.cssText='width:'+v+'%;background:'+getColor(v);
    const el=document.getElementById('val-'+m);
    el.textContent=v+'%'; el.className='pval '+getCls(v);
  });
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.sbtn[data-id="'+s.id+'"]').classList.add('active');
}
const nav=document.getElementById('nav');
scenarios.forEach(s=>{
  const btn=document.createElement('button');
  btn.className='sbtn '+s.cls; btn.dataset.id=s.id; btn.textContent='C'+s.id;
  btn.onclick=()=>render(s); nav.appendChild(btn);
});
render(scenarios[0]);
</script>
